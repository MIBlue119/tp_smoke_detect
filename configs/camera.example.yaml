service_name: tp-smoke-detect
environment: development
cameras:
  - camera_id: camera-example-01
    zone_id: entrance
    enabled: true
    analysis_fps: 5
    roi:
      - {x: 0.0, y: 0.0}
      - {x: 1.0, y: 0.0}
      - {x: 1.0, y: 1.0}
      - {x: 0.0, y: 1.0}
    excluded_zones: []
    min_face_pixels: 32
    min_crop_pixels: 64
    day_night: auto

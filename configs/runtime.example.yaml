service_name: tp-smoke-detect
environment: development
candidate:
  topic: track.candidate.v1
  dead_letter_topic: track.candidate.v1.dead-letter
  broker_host: 127.0.0.1
  broker_port: 1883
  max_inflight: 32
  retry_limit: 3
  require_gpu_receipts: true
policy:
  mode: simulation
  audio_muted: true
  reject_on_unclear: true
  min_persistence_ms: 2000
  min_independent_channels: 2
  queue_max_per_camera: 32
  cooldown_seconds: 60
  hourly_audio_cap: 10
  daily_audio_cap: 100

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tp-smoke-detect"
version = "0.1.0"
description = "On-premise smoking-behaviour detection AI core"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Walnutek" }]
dependencies = [
  "fastapi>=0.115,<1",
  "paho-mqtt>=2.1,<3",
  "uvicorn>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "PyYAML>=6.0,<7",
  "cryptography>=50,<51",
  "Pillow>=11,<13",
]

[project.scripts]
smoke-detect = "tp_smoke_detect.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0,<7",
]
gpu = [
  "onnxruntime-gpu>=1.19,<2",
]
ml = [
  "mlflow>=2.18,<3",
]
demo = [
  "yt-dlp==2026.8.19",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tp_smoke_detect"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "gpu: target-hardware qualification (opt-in; skipped on the CPU profile)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = '(^|/)(build|dist|\\.venv)/'

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1040" width="1000" height="1040" role="img" aria-label="吸菸偵測系統的縱向級聯管線：20 路攝影機影像經硬體解碼、人形偵測與追蹤、姿態關卡、物件分類、軌跡聚合、抽吸週期邏輯後，僅少數候選事件送入 VLM 複核，再經告警政策才觸發語音；每鏡頭每日的殘餘誤報從 300 條軌跡逐關降到 0.021 次誤播。"><style>
svg{
  --surface:#FFFFFF; --surface-2:#F4F7F7; --surface-3:#E4EAEA;
  --ink:#0F1719; --ink-2:#39484C; --muted:#6C7C80; --line-2:#BCC7C8;
  --accent:#BC440E; --accent-ink:#943409; --accent-soft:#F9E8DF; --teal-soft:#DBE8E7;
  color:var(--ink); background:#FFFFFF;
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
 svg{
  --surface:#111A1C; --surface-2:#162124; --surface-3:#1D2A2D;
  --ink:#E3EBEB; --ink-2:#AFC0C1; --muted:#7C9092; --line-2:#3A4B4E;
  --accent:#EE7738; --accent-ink:#F08953; --accent-soft:#2A1609; --teal-soft:#102A2A;
  background:#111A1C;
 }
}
.bx{fill:var(--surface);stroke:currentColor;stroke-width:1.25}
.bx2{fill:var(--surface-2);stroke:currentColor;stroke-width:1.25}
.bx3{fill:var(--surface-3);stroke:var(--line-2);stroke-width:1.25}
.bxh{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.6}
.bxd{fill:none;stroke:var(--line-2);stroke-width:1.25;stroke-dasharray:6 5}
text{fill:currentColor}
.tt{font-size:13px;font-weight:700}
.ts{font-size:11.5px;font-weight:700}
.td{font-size:10.5px;fill:var(--ink-2)}
.tl{font-size:10.5px;fill:var(--muted);font-family:"IBM Plex Mono",monospace;letter-spacing:.02em}
.tg{font-size:10.5px;fill:var(--muted)}
.tn{font-family:"IBM Plex Mono",monospace;font-size:16px;font-weight:600}
.hot{fill:var(--accent-ink)}
.ln{stroke:currentColor;stroke-width:1.25;fill:none}
.lnh{stroke:var(--accent);stroke-width:1.6;fill:none}
.lnm{stroke:var(--line-2);stroke-width:1.25;fill:none}
.dash{stroke-dasharray:5 4}
.ah{fill:currentColor}
.ahh{fill:var(--accent)}
.ahm{fill:var(--line-2)}
.band1{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.4}
.band2{fill:var(--teal-soft);stroke:var(--line-2);stroke-width:1.2}
.band3{fill:var(--surface-2);stroke:var(--line-2);stroke-width:1.2}
</style><rect x="0" y="0" width="1000" height="1040" fill="var(--surface)"/>
    <defs>
      <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
      <marker id="a1h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahh" d="M0,0 L10,5 L0,10 z"/></marker>
      <marker id="a1m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahm" d="M0,0 L10,5 L0,10 z"/></marker>
    </defs>

    <!-- right gutter header -->
    <text class="tl" x="680" y="26">殘餘誤報 · 每鏡頭每日</text>

    <!-- left brackets -->
    <path class="lnm" d="M168,40 L160,40 L160,102 L168,102"/>
    <text class="tg" x="145" y="75" text-anchor="end">現場設備</text>

    <path class="lnm" d="M168,128 L160,128 L160,718 L168,718"/>
    <text class="ts" x="145" y="399" text-anchor="end">GPU 0</text>
    <text class="tg" x="145" y="416" text-anchor="end">持續執行</text>
    <text class="tg" x="145" y="432" text-anchor="end">約 200 推論／秒</text>
    <text class="tg" x="145" y="448" text-anchor="end">約 19% 使用率</text>

    <path class="lnh" d="M168,744 L160,744 L160,806 L168,806"/>
    <text class="ts hot" x="145" y="759" text-anchor="end">GPU 1</text>
    <text class="tg" x="145" y="776" text-anchor="end">受門控觸發</text>
    <text class="tg" x="145" y="792" text-anchor="end">約 2.5% 工作週期</text>

    <path class="lnm" d="M168,832 L160,832 L160,982 L168,982"/>
    <text class="ts" x="145" y="900" text-anchor="end">應用層</text>
    <text class="tg" x="145" y="917" text-anchor="end">CPU</text>

    <!-- boxes -->
    <rect class="bx2" x="190" y="40" width="430" height="62" rx="4"/>
    <text class="tt" x="210" y="66">20 路 RTSP 攝影機</text>
    <text class="td" x="210" y="85">4K 1/1.8" 情境鏡頭 + 望遠熱點鏡頭 · 非中國廠牌</text>

    <rect class="bx" x="190" y="128" width="430" height="62" rx="4"/>
    <text class="tt" x="210" y="154">NVDEC 硬體解碼</text>
    <text class="td" x="210" y="173">全速 30 fps 解碼（硬體資源，幾乎免費）</text>

    <rect class="bx" x="190" y="216" width="430" height="62" rx="4"/>
    <text class="tt" x="210" y="242">S-1　前處理與涵蓋關卡</text>
    <text class="td" x="210" y="261">CLAHE + 日夜設定檔 · 臉框 ≥40 px · 區域遮罩</text>

    <rect class="bx" x="190" y="304" width="430" height="62" rx="4"/>
    <text class="tt" x="210" y="330">S0　人形偵測 + 追蹤</text>
    <text class="td" x="210" y="349">TAO RT-DETR @10 fps · 軌跡 ≥3 秒才具備資格</text>

    <rect class="bx" x="190" y="392" width="430" height="62" rx="4"/>
    <text class="tt" x="210" y="418">S1　手近嘴姿態關卡</text>
    <text class="td" x="210" y="437">d(手,嘴) &lt; 1.2 × 兩眼間距 · 停留 0.6–5.0 秒</text>

    <rect class="bx" x="190" y="480" width="430" height="62" rx="4"/>
    <text class="tt" x="210" y="506">S2　物件分類頭（8 類）</text>
    <text class="td" x="210" y="525">具名負類：電子煙／手機／杯／食物／筆／檳榔</text>

    <rect class="bx" x="190" y="568" width="430" height="62" rx="4"/>
    <text class="tt" x="210" y="594">S3　軌跡聚合 + 咀嚼否決</text>
    <text class="td" x="210" y="613">25 影格中 ≥12 正例 · 校準均值 ≥0.62 · 檳榔硬否決</text>

    <rect class="bx" x="190" y="656" width="430" height="62" rx="4"/>
    <text class="tt" x="210" y="682">S4　抽吸週期邏輯</text>
    <text class="td" x="210" y="701">90 秒內 ≥2 個完整週期 · 停留 0.8–4s · 間隔 8–45s</text>

    <rect class="bxh" x="190" y="744" width="430" height="62" rx="4"/>
    <text class="tt hot" x="210" y="770">S5　VLM 複核</text>
    <text class="td" x="210" y="789">裁切放大至 448² · 5 影格蒙太奇 · 3/3 一致才通過</text>

    <rect class="bx" x="190" y="832" width="430" height="62" rx="4"/>
    <text class="tt" x="210" y="858">S6　告警政策</text>
    <text class="td" x="210" y="877">≥2 獨立證據通道 · 持續 ≥20 秒 · 區域冷卻 600 秒</text>

    <rect class="bx2" x="190" y="920" width="430" height="62" rx="4"/>
    <text class="tt" x="210" y="946">輸出</text>
    <text class="td" x="210" y="965">IP 喇叭語音勸導 · Smart Record 存證 · 審查佇列</text>

    <!-- arrows -->
    <line class="ln" x1="405" y1="102" x2="405" y2="126" marker-end="url(#a1)"/>
    <text class="tl" x="418" y="119">20 × 1080p30</text>

    <line class="ln" x1="405" y1="190" x2="405" y2="214" marker-end="url(#a1)"/>
    <text class="tl" x="418" y="207">原始影格</text>

    <line class="ln" x1="405" y1="278" x2="405" y2="302" marker-end="url(#a1)"/>
    <text class="tl" x="418" y="295">合格影格 @10 fps ≈ 200 推論/秒</text>

    <line class="ln" x1="405" y1="366" x2="405" y2="390" marker-end="url(#a1)"/>
    <text class="tl" x="418" y="383">人員軌跡</text>

    <line class="ln" x1="405" y1="454" x2="405" y2="478" marker-end="url(#a1)"/>
    <text class="tl" x="418" y="471">手到嘴事件</text>

    <line class="ln" x1="405" y1="542" x2="405" y2="566" marker-end="url(#a1)"/>
    <text class="tl" x="418" y="559">逐影格 8 類分數</text>

    <line class="ln" x1="405" y1="630" x2="405" y2="654" marker-end="url(#a1)"/>
    <text class="tl" x="418" y="647">候選軌跡</text>

    <line class="lnh" x1="405" y1="718" x2="405" y2="742" marker-end="url(#a1h)"/>
    <text class="tl hot" x="418" y="735">完成週期的軌跡 → 觸發 VLM</text>

    <line class="lnh" x1="405" y1="806" x2="405" y2="830" marker-end="url(#a1h)"/>
    <text class="tl hot" x="418" y="823">yes / no / unclear</text>

    <line class="ln" x1="405" y1="894" x2="405" y2="918" marker-end="url(#a1)"/>
    <text class="tl" x="418" y="911">確認事件</text>

    <!-- right gutter values -->
    <text class="tn" x="680" y="342">300</text><text class="tg" x="726" y="342">條人員軌跡</text>
    <text class="tn" x="680" y="430">75</text><text class="tg" x="712" y="430">通過姿態關卡</text>
    <text class="tn" x="680" y="518">90</text><text class="tg" x="712" y="518">個誤判裁切</text>
    <text class="tn" x="680" y="606">3.0</text><text class="tg" x="716" y="606">條軌跡</text>
    <text class="tn" x="680" y="694">0.60</text><text class="tg" x="728" y="694">條軌跡</text>
    <text class="tn hot" x="680" y="782">0.060</text><text class="tg" x="738" y="782">通過 VLM</text>
    <text class="tn hot" x="680" y="870">0.021</text><text class="tg" x="738" y="870">次誤播 ← SLA</text>
    <text class="tg" x="680" y="958">全站 20 路 ≈ 每月 13 次</text>

    <!-- feedback loop -->
    <path class="lnm dash" d="M405,982 L405,1012 L960,1012 L960,530 L628,530" marker-end="url(#a1m)"/>
    <text class="tl" x="560" y="1004" text-anchor="middle">操作員標記 → 硬負樣本池 → 每週重校準 τ、每月重訓</text>
  </svg>
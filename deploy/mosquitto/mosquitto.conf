# Local metadata-only broker.  Candidate payloads contain artifact IDs and
# structured observations, never image bytes, credentials, or arbitrary URLs.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
allow_anonymous true
listener 1883 0.0.0.0
listener_allow_anonymous true
max_inflight_messages 32
max_queued_messages 128
message_size_limit 65536
connection_messages false

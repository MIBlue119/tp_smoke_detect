global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: smoke-detect
    metrics_path: /metrics
    static_configs:
      - targets: ["smoke-detect:8000"]

  - job_name: baseline-model
    metrics_path: /metrics
    static_configs:
      - targets: ["baseline-model:8002"]

  - job_name: gpu-readiness
    metrics_path: /health/ready
    static_configs:
      - targets: ["gpu-readiness:8080"]

rule_files:
  - /etc/prometheus/rules.yml

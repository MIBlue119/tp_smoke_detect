# INT-701 air-gap-ready reference deployment.
#
# Before release, resolve every image digest in image-pins.yaml and replace
# the build image argument / image references with those digests.  The default
# CPU profile starts only services that are implemented and wired: the
# SQLite-backed API and local metrics. PostgreSQL/MQTT are retained as an
# explicit future-site profile until their adapters are released; media and
# audio likewise require site hardware or an adapter decision.
name: tp-smoke-detect

services:
  smoke-detect:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core
      args:
        PYTHON_IMAGE: ${SMOKE_CORE_BASE_IMAGE:-python:3.11.11-slim-bookworm@sha256:081075da77b2b55c23c088251026fb69a7b2bf92471e491ff5fd75c192fd38e5}
    image: ${SMOKE_CORE_IMAGE:-tp-smoke-detect/core:0.1.0-cpu}
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      SMOKE_DETECT_ENVIRONMENT: production
      SMOKE_DETECT_DATABASE: /var/lib/smoke-detect/state/audit.sqlite3
      SMOKE_DETECT_ARTIFACT_ROOT: /var/lib/smoke-detect/artifacts
      SMOKE_DETECT_POLICY_CONFIG: /etc/smoke-detect/policy.yaml
      SMOKE_DETECT_CAMERAS_CONFIG: /etc/smoke-detect/cameras.yaml
      # The API is the CPU control plane; the GPU candidate-consumer owns the
      # active model-manifest binding and is the only live candidate consumer.
      SMOKE_DETECT_CANDIDATE__REQUIRE_GPU_RECEIPTS: "false"
    ports:
      - "127.0.0.1:${SMOKE_CORE_PORT:-8000}:8000"
    networks: [site_net, gpu_net]
    volumes:
      - smoke_state:/var/lib/smoke-detect/state
      - smoke_artifacts:/var/lib/smoke-detect/artifacts
      - ./../configs/policy.example.yaml:/etc/smoke-detect/policy.yaml:ro
      - ./../configs/camera.example.yaml:/etc/smoke-detect/cameras.yaml:ro
    healthcheck:
      test: [CMD, python, /app/scripts/healthcheck.py, --url, http://127.0.0.1:8000/health/live]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  postgres:
    profiles: [future-site]
    image: ${SMOKE_POSTGRES_IMAGE:-postgres:16.4-alpine}
    restart: unless-stopped
    read_only: true
    user: "999:999"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /run/postgresql:rw,noexec,nosuid,size=16m
    environment:
      POSTGRES_DB: smoke_detect
      POSTGRES_USER: smoke_detect
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./../src/tp_smoke_detect/adapters/persistence/migrations:/docker-entrypoint-initdb.d:ro
    networks: [site_net]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U smoke_detect -d smoke_detect]
      interval: 10s
      timeout: 5s
      retries: 6

  mqtt:
    profiles: [future-site, gpu-rtx3090]
    image: ${SMOKE_MQTT_IMAGE:-eclipse-mosquitto:2.0.20}
    restart: unless-stopped
    read_only: true
    user: "1883:1883"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    expose: [1883]
    networks: [site_net, gpu_net]
    healthcheck:
      test: [CMD-SHELL, mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -C 1 -W 2 >/dev/null]
      interval: 10s
      timeout: 5s
      retries: 6

  prometheus:
    image: ${SMOKE_PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    restart: unless-stopped
    read_only: true
    user: "65534:65534"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - ./prometheus/dashboard.json:/etc/prometheus/dashboard.json:ro
      - prometheus_data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.listen-address=0.0.0.0:9090"]
    depends_on:
      smoke-detect:
        condition: service_healthy
    networks: [site_net, gpu_net]
    ports:
      - "127.0.0.1:${SMOKE_PROMETHEUS_PORT:-9090}:9090"

  media-reference:
    profiles: [media]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.media
      target: reference
    image: ${SMOKE_MEDIA_REFERENCE_IMAGE:-tp-smoke-detect/media:0.1.0-reference}
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - smoke_artifacts:/var/lib/smoke-detect/artifacts:ro
    networks: [site_net]

  audio-fake:
    profiles: [audio]
    image: ${SMOKE_CORE_IMAGE:-tp-smoke-detect/core:0.1.0-cpu}
    entrypoint: ["python", "-c"]
    command: ["print('fake audio adapter: catalogued messages only; no device attached')"]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks: [site_net]

  gpu-preflight:
    profiles: [gpu-rtx3090]
    image: ${SMOKE_CORE_IMAGE:-tp-smoke-detect/core:0.1.0-cpu}
    restart: "no"
    entrypoint: ["python", "/app/scripts/verify_gpu_bundle.py"]
    command: ["--pins", "/bundle/image-pins.yaml", "--manifest", "/models/manifest/model-release.json", "--one-stream-receipt", "/run/smoke-detect/gpu-readiness.json", "--receipt", "/run/smoke-detect/gpu-bundle.json"]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./image-pins.yaml:/bundle/image-pins.yaml:ro
      - ./../model-repository:/models:ro
      - ./../docs/dev_artifacts/qualification:/run/smoke-detect:rw
    networks: [gpu_net]

  baseline-model:
    profiles: [gpu-rtx3090]
    image: ${SMOKE_GPU_MEDIA_IMAGE:-nvcr.io/nvidia/deepstream:7.0-triton-multiarch@sha256:c11befa808af8270e8ea0d0d7cc7cabbda08a2f496ee30b95f7acba5dce81759}
    restart: unless-stopped
    init: true
    entrypoint: ["/opt/smoke-detect/bin/triton-entrypoint"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    environment:
      NVIDIA_VISIBLE_DEVICES: ${SMOKE_GPU_DEVICE:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SMOKE_MODEL_MANIFEST: /models/manifest/model-release.json
    volumes:
      - ./../model-repository:/models:ro
      - ./triton-entrypoint.sh:/opt/smoke-detect/bin/triton-entrypoint:ro
    expose: [8000, 8001, 8002]
    depends_on:
      gpu-preflight:
        condition: service_completed_successfully
    networks: [gpu_net]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${SMOKE_GPU_DEVICE:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: [CMD-SHELL, wget -q -O - http://127.0.0.1:8000/v2/health/ready >/dev/null]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  media-gpu:
    profiles: [gpu-rtx3090]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.media
      target: deepstream
      args:
        DEEPSTREAM_IMAGE: ${SMOKE_GPU_BASE_IMAGE:-nvcr.io/nvidia/deepstream:7.0-triton-multiarch@sha256:c11befa808af8270e8ea0d0d7cc7cabbda08a2f496ee30b95f7acba5dce81759}
    image: ${SMOKE_GPU_MEDIA_IMAGE:-tp-smoke-detect/media:0.1.0-gpu}
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    environment:
      NVIDIA_VISIBLE_DEVICES: ${SMOKE_GPU_DEVICE:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SMOKE_MODEL_MANIFEST: /models/manifest/model-release.json
      SMOKE_GPU_READINESS_RECEIPT: /run/smoke-detect/gpu-readiness.json
      # The readiness receipt is bound to this exact digest.  Operators may
      # override it only together with the matching pinned image and receipt.
      SMOKE_GPU_IMAGE_DIGEST: ${SMOKE_GPU_IMAGE_DIGEST:-c11befa808af8270e8ea0d0d7cc7cabbda08a2f496ee30b95f7acba5dce81759}
      SMOKE_GPU_RECEIPT_SIGNING_KEY: /run/secrets/gpu_receipt_signing_key
      SMOKE_GPU_RECEIPT_SIGNING_KEY_ID: ${SMOKE_GPU_RECEIPT_SIGNING_KEY_ID:-gpu-qualification}
      SMOKE_GPU_MEDIA_CONFIG: /etc/smoke-detect/deepstream/config.txt
      SMOKE_GPU_MEDIA_EXECUTABLE: ${SMOKE_GPU_MEDIA_EXECUTABLE:-/opt/smoke-detect/bin/media-publisher}
    secrets:
      - source: gpu_receipt_signing_key
        target: gpu_receipt_signing_key
        mode: 0400
    volumes:
      - ./../model-repository:/models:ro
      - ./../docs/dev_artifacts/qualification:/run/smoke-detect:ro
      - ./deepstream/rtx3090/config.txt:/etc/smoke-detect/deepstream/config.txt:ro
      - ${SMOKE_GPU_REPLAY_ROOT:-../tests/fixtures/media}:/media/replay:ro
    depends_on:
      baseline-model:
        condition: service_healthy
    networks: [gpu_net]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${SMOKE_GPU_DEVICE:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: [CMD-SHELL, kill -0 1]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

  candidate-consumer:
    profiles: [gpu-rtx3090]
    image: ${SMOKE_CORE_IMAGE:-tp-smoke-detect/core:0.1.0-cpu}
    restart: unless-stopped
    init: true
    entrypoint: ["python", "-m", "tp_smoke_detect.cli"]
    command: ["serve-candidates", "--config", "/etc/smoke-detect/runtime.yaml", "--ready-file", "/run/gpu-state/candidate-ready"]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    environment:
      SMOKE_DETECT_POLICY_CONFIG: /etc/smoke-detect/policy.yaml
      SMOKE_DETECT_CAMERAS_CONFIG: /etc/smoke-detect/cameras.yaml
      SMOKE_MODEL_MANIFEST: /models/manifest/model-release.json
    volumes:
      - smoke_state:/var/lib/smoke-detect/state
      - smoke_artifacts:/var/lib/smoke-detect/artifacts
      - gpu_runtime_state:/run/gpu-state
      - ./../model-repository:/models:ro
      - ./../configs/runtime.gpu-rtx3090.yaml:/etc/smoke-detect/runtime.yaml:ro
      - ./../configs/policy.example.yaml:/etc/smoke-detect/policy.yaml:ro
      - ./../configs/camera.example.yaml:/etc/smoke-detect/cameras.yaml:ro
    depends_on:
      smoke-detect:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      media-gpu:
        condition: service_healthy
      baseline-model:
        condition: service_healthy
    networks: [gpu_net]
    healthcheck:
      test: [CMD-SHELL, test -r /run/gpu-state/candidate-ready]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  reviewer-model:
    profiles: [gpu-vlm]
    image: ${SMOKE_GPU_REVIEWER_IMAGE:-tp-smoke-detect/reviewer:unqualified}
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["echo 'reviewer image is not qualified; no-VLM baseline remains active' >&2; exit 78"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [gpu_net]

  gpu-readiness:
    profiles: [gpu-rtx3090]
    image: ${SMOKE_CORE_IMAGE:-tp-smoke-detect/core:0.1.0-cpu}
    restart: unless-stopped
    init: true
    entrypoint: ["python", "/app/scripts/gpu_readiness_server.py"]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    environment:
      SMOKE_GPU_READINESS_RECEIPT: /run/smoke-detect/gpu-readiness.json
      SMOKE_GPU_CANDIDATE_READY_FILE: /run/gpu-state/candidate-ready
      SMOKE_MODEL_MANIFEST: /models/manifest/model-release.json
      SMOKE_IMAGE_PINS: /bundle/image-pins.yaml
    volumes:
      - ./../docs/dev_artifacts/qualification:/run/smoke-detect:ro
      - gpu_runtime_state:/run/gpu-state:ro
      - ./../model-repository:/models:ro
      - ./image-pins.yaml:/bundle/image-pins.yaml:ro
    depends_on:
      smoke-detect:
        condition: service_healthy
      baseline-model:
        condition: service_healthy
      media-gpu:
        condition: service_healthy
      candidate-consumer:
        condition: service_healthy
    expose: [8080]
    networks: [gpu_net]
    healthcheck:
      test: [CMD-SHELL, wget -q -O - http://127.0.0.1:8080/health/ready >/dev/null]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  postgres_data:
  mqtt_data:
  mqtt_log:
  prometheus_data:
  smoke_state:
  smoke_artifacts:
  gpu_runtime_state:

networks:
  site_net:
    internal: true
  gpu_net:
    internal: true

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  gpu_receipt_signing_key:
    file: ${SMOKE_GPU_RECEIPT_SIGNING_KEY_FILE:-./secrets/gpu_receipt_signing_key.txt}

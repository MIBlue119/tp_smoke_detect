release_gate:
  - resolve every REQUIRED-BEFORE-RELEASE digest before deployment
  - attach SBOM and vulnerability disposition for every resolved image
  - import images into the site registry before starting compose
  - keep runtime egress disabled; model/media files are mounted local artifacts
  - GPU readiness remains false until the host/import receipt is complete and the
    one-stream and capacity gates have passed

# Image provenance manifest for the air-gapped release bundle.
#
# Tags are intentionally human-readable build inputs.  A release is not
# qualified until each digest is filled from `docker image inspect` after the
# image has been scanned and exported.  `scripts/qualify_media_host.sh` records
# the GPU image digests; this file records the CPU/service inputs as well.
